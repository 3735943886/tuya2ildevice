name: Release

# Push a tag like `v0.1.0` to build and publish that version to PyPI.
# `pyproject.toml` uses hatch-vcs: the package version is derived from this tag (the `v` prefix is
# stripped automatically), so there is nothing to bump by hand before tagging.
#
# One-time setup on PyPI (no token needed -- this uses Trusted Publishing/OIDC):
#   https://pypi.org/manage/project/tuya2ildevice/settings/publishing/ (after the first manual upload,
#   or pre-register the project name) -> add a trusted publisher with:
#     owner: 3735943886, repository: tuya2ildevice, workflow: release.yml, environment: pypi

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install cibuildwheel build
      - run: python -m cibuildwheel --output-dir dist
      - if: runner.os == 'Linux'
        run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tuya2ildevice
    permissions:
      id-token: write   # Trusted Publishing: no PYPI_API_TOKEN secret needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
