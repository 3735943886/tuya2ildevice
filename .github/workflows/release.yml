name: Release

# Push a tag like `v0.1.0` to build and publish that version to PyPI.
# `pyproject.toml` uses hatch-vcs: the package version is derived from this tag (the `v` prefix is
# stripped automatically), so there is nothing to bump by hand before tagging.
#
# One-time setup on PyPI (no token needed -- this uses Trusted Publishing/OIDC):
#   https://pypi.org/manage/project/tuya2ildevice/settings/publishing/ (after the first manual upload,
#   or pre-register the project name) -> add a trusted publisher with:
#     owner: 3735943886, repository: tuya2ildevice, workflow: release.yml, environment: pypi

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, so hatch-vcs can derive the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tuya2ildevice
    permissions:
      id-token: write   # Trusted Publishing: no PYPI_API_TOKEN secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
