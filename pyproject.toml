[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tuya2ildevice"
dynamic = ["version"]
description = "Sans-IO converter: Tuya (rustuya / rustuya-bridge) device + DPS packets <-> ildevice descriptor, values and commands"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Home Automation"]

[project.urls]
Repository = "https://github.com/3735943886/tuya2ildevice"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "jsonschema", "paho-mqtt>=2.0"]
host = ["paho-mqtt>=2.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/tuya2ildevice"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
required-version = ">=0.16"      # CI pins 0.16.8; older ones disagree on some rules
