[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tuya2ildevice"
dynamic = ["version"]
description = "Sans-IO converter: Tuya (rustuya / rustuya-bridge) device + DPS packets <-> ildevice descriptor, values and commands"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Home Automation", "Programming Language :: Rust"]

[project.urls]
Repository = "https://github.com/3735943886/tuya2ildevice"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "jsonschema", "paho-mqtt>=2.0",
        "tuya-device-sharing-sdk==0.2.15", "cryptography"]      # the oracle tests/test_adapter.py checks the value conversions against
host = ["paho-mqtt>=2.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/tuya2ildevice"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "hatch_build.py", "rust", "rules"]
exclude = ["rust/target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
required-version = ">=0.16"      # CI pins 0.16.8; older ones disagree on some rules

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest", "pytest-asyncio", "jsonschema", "paho-mqtt", "tuya-device-sharing-sdk==0.2.15", "cryptography"]
test-command = "python -m pytest {project}/tests --override-ini=pythonpath= -q"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
