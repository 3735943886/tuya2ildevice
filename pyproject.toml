[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuya2ildevice"
version = "0.0.1"
description = "Sans-IO converter: Tuya (rustuya / rustuya-bridge) device + DPS packets <-> ildevice descriptor, values and commands"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Home Automation"]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]
host = ["paho-mqtt>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tuya2ildevice"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
